apply plugin: 'com.android.application'

def userHome = System.getProperty('user.home')
def credsFile = file("${userHome}/.karachi-runner-keys/credentials.txt")
def credsProps = new Properties()
if (credsFile.exists()) {
    credsFile.withInputStream { credsProps.load(it) }
}
def releaseSigningValues = [
    storeFile: System.getenv('KARACHI_RUNNER_KEYSTORE') ?: credsProps.getProperty('KARACHI_RUNNER_KEYSTORE') ?: "${userHome}/.karachi-runner-keys/upload.jks",
    storePassword: System.getenv('KARACHI_RUNNER_KEYSTORE_PASSWORD') ?: credsProps.getProperty('KEYSTORE_PASSWORD'),
    keyAlias: System.getenv('KARACHI_RUNNER_KEY_ALIAS') ?: credsProps.getProperty('KEY_ALIAS'),
    keyPassword: System.getenv('KARACHI_RUNNER_KEY_PASSWORD') ?: credsProps.getProperty('KEY_PASSWORD')
]
def hasReleaseSigning = releaseSigningValues.values().every { it }

def rootPkgJson = file("${rootDir}/../package.json")
def pkgVersion = "2.2.13"
if (rootPkgJson.exists()) {
    try {
        def parsedPkg = new groovy.json.JsonSlurper().parseText(rootPkgJson.text)
        if (parsedPkg?.version) {
            pkgVersion = parsedPkg.version
        }
    } catch (ignored) {}
}

def releaseVersionCodeValue = project.findProperty('releaseVersionCode') ?: System.getenv('KARACHI_RUNNER_VERSION_CODE') ?: '35'
def releaseVersionNameValue = project.findProperty('releaseVersionName') ?: System.getenv('KARACHI_RUNNER_VERSION_NAME') ?: pkgVersion
def releaseVersionCode = releaseVersionCodeValue.toString().toInteger()
def releaseVersionName = releaseVersionNameValue.toString()

android {
    namespace "com.holeio.karachi"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "pk.karachi.runner"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode releaseVersionCode
        versionName releaseVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseSigningValues.storeFile)
                storePassword releaseSigningValues.storePassword
                keyAlias releaseSigningValues.keyAlias
                keyPassword releaseSigningValues.keyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

tasks.configureEach { task ->
    if (task.name in ['assembleRelease', 'bundleRelease', 'packageRelease']) {
        task.doFirst {
            if (!hasReleaseSigning) {
                throw new GradleException(
                    'Release signing is not configured. Set KARACHI_RUNNER_KEYSTORE, ' +
                    'KARACHI_RUNNER_KEYSTORE_PASSWORD, KARACHI_RUNNER_KEY_ALIAS, and KARACHI_RUNNER_KEY_PASSWORD.'
                )
            }
            if (!releaseVersionName) {
                throw new GradleException('Set KARACHI_RUNNER_VERSION_NAME or -PreleaseVersionName for a Play release.')
            }
            if (!releaseVersionCode || releaseVersionCode < 1) {
                throw new GradleException('Set KARACHI_RUNNER_VERSION_CODE or -PreleaseVersionCode for a Play release.')
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22") {
            because("kotlin-stdlib-jdk7 is now part of kotlin-stdlib")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22") {
            because("kotlin-stdlib-jdk8 is now part of kotlin-stdlib")
        }
    }
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
